name: supermarket_app
description: Supermarket Flutter App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  cached_network_image: ^3.3.1
  # carousel_slider dihapus karena konflik dengan Flutter 3.x CarouselController
  # Diganti dengan PageView bawaan Flutter (sudah diimplementasi di home_screen.dart)
  shimmer: ^3.0.0
  badges: ^3.1.2
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/